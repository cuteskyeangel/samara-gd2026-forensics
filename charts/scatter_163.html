function filteredData(mode){

    if (isRing(t)) return t;
    var cd = t.customdata || [];
    if (!cd.length) return t;
    var x = [], y = [], txt = [];
    for (var i = 0; i < cd.length; i++){
      var keep = (mode === 'all') || (mode === 'anom' ? cd[i] === 1 : cd[i] === 0);
      if (keep){ x.push(t.x[i]); y.push(t.y[i]); if (t.text) txt.push(t.text[i]); }
    }
    var nt = Object.assign({}, t);
    nt.x = x; nt.y = y; if (t.text) nt.text = txt;
    if (mode === 'anom') nt.marker = Object.assign({}, t.marker, {size: 9, opacity: .95});
    return nt;
  });
}
